services:
  - type: web
    name: jev-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TYPESAFE_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: JEV_MODEL
        value: jev-1.13.0
      - key: JEV_INPUT_PRICE_PER_MILLION
        value: "0.042"
      - key: LLM_INPUT_PRICE_PER_MILLION
        value: "0.59"
      - key: LLM_OUTPUT_PRICE_PER_MILLION
        value: "0.79"
      - key: CORS_ORIGINS
        value: "*"
